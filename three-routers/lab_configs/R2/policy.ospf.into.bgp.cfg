set interfaces ge-0/0/0.0 family inet address 10.1.2.2/24
set interfaces ge-0/0/1.0 family inet address 10.2.3.2/24
set interfaces ge-0/0/3.0 family inet address 10.101.102.2/24
set interfaces lo0.0 family inet address 2.2.2.2/32
set protocols ospf area 0 interface ge-0/0/0.0 interface-type p2p  
set protocols ospf area 0 interface ge-0/0/3.0 interface-type p2p    
set protocols ospf area 1 interface lo0.0                            
set protocols bgp group EBGP type external
set protocols bgp group EBGP neighbor 10.2.3.3 peer-as 65001
set routing-options router-id 10.0.0.2 
set routing-options autonomous-system 65000
set protocols bgp export OSPF_TO_BGP
set policy-options policy-statement OSPF_TO_BGP from protocol ospf
set policy-options policy-statement OSPF_TO_BGP then accept
