set interfaces ge-0/0/0.0 family inet address 10.1.2.2/24
set interfaces ge-0/0/0.0 family inet6 address 2001:db8:1:2::2/64
set interfaces ge-0/0/0 unit 0 family inet filter input infra_filter_v4
set interfaces ge-0/0/1.0 family inet address 10.2.3.2/24
set interfaces ge-0/0/1.0 family inet6 address 2001:db8:2:3::2/64
set interfaces lo0.0 family inet address 2.2.2.2/32
set interfaces lo0.0 family inet6 address 2001:db8::2/128
set protocols ospf area 0 interface ge-0/0/0.0 interface-type p2p  
set protocols ospf area 0 interface ge-0/0/1.0 interface-type p2p    
set protocols ospf area 0 interface lo0.0                            
set protocols ospf3 area 0 interface ge-0/0/0.0 interface-type p2p  
set protocols ospf3 area 0 interface ge-0/0/1.0 interface-type p2p    
set protocols ospf3 area 0 interface lo0.0                            
set routing-options router-id 10.0.0.2 
set policy-options prefix-list infra_prefixes 10.1.2.2/32    
set policy-options prefix-list infra_prefixes 10.2.3.2/32    
set policy-options prefix-list infra_prefixes 2.2.2.2/32
set firewall family inet filter infra_filter_v4 term block_infra_addresses from destination-prefix-list infra_prefixes
set firewall family inet filter infra_filter_v4 term block_infra_addresses then discard
set firewall family inet filter infra_filter_v4 term allow_all then accept
