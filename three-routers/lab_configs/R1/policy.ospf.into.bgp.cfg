set interfaces ge-0/0/0.0 family inet address 10.1.2.1/24
set interfaces ge-0/0/3.0 family inet address 10.101.102.1/24
set interfaces lo0.0 family inet address 1.1.1.1/32
set protocols ospf area 0 interface ge-0/0/0.0 interface-type p2p  
set protocols ospf area 0 interface ge-0/0/3.0 interface-type p2p
set protocols ospf area 0 interface lo0.0                            
set routing-options router-id 10.0.0.1
set routing-options static route 10.0.0.0/16 discard
set routing-options static route 10.0.1.0/24 discard
set routing-options static route 10.2.0.0/16 discard
set policy-options policy-statement STATIC_TO_OSPF from protocol static
set policy-options policy-statement STATIC_TO_OSPF then accept
set protocols ospf export STATIC_TO_OSPF
