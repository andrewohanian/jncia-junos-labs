set interfaces ge-0/0/0.0 family inet address 10.2.3.3/24
set interfaces lo0.0 family inet address 3.3.3.3/32
set protocols bgp group EBGP type external
set protocols bgp group EBGP export BGP_ADVERTISEMENTS
set protocols bgp group EBGP neighbor 10.2.3.2 peer-as 65000
set routing-options router-id 10.0.0.3 
set routing-options autonomous-system 65001
set policy-options policy-statement BGP_ADVERTISEMENTS from route-filter 3.3.3.3/32 exact 
set policy-options policy-statement BGP_ADVERTISEMENTS then accept  
